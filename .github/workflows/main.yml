
name: Crear APK de Pixel Loco

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar herramientas
        run: |
          npm install -g @capacitor/cli@6
          mkdir -p www
          cp Pixel_Loco_Preguntas_Absurdas.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6

      - name: Crear configuración Android
        run: |
          npx cap init "Pixel Loco" "com.pixelloco.game" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Loco-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
